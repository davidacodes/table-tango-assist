services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexttable
      POSTGRES_USER: nexttable
      POSTGRES_PASSWORD: nexttable
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexttable -d nexttable"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      NEXTTABLE_DATABASE_URL: postgresql+psycopg://nexttable:nexttable@db:5432/nexttable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
